# Echa: dalsze ciągi decyzji Andersona i wydarzeń świata (decyzja 0019).
#
# Echo podpina się pod źródło polem `on` („dylemat.opcja”, „dylemat.biernosc”, „wątek.etap.opcja”,
# „wątek.etap.gałąź” albo identyfikator wzorca) i wraca po `after` kwartałach jako depesza.
# Echo ciche (`silent: true`) nie daje depeszy: zostawia ślad, zwykle wpis w Rejestrze Następstw.
# Wpis z `visible: false` jest ukryty przed graczem; zna go tylko silnik i narrator.

echoes:
  # ── Lotnictwo kontra NACA ─────────────────────────────────────────────────────────
  - id: naca-pamieta
    on: [lotnictwo-kontra-naca.lotnictwo]
    after: 0
    silent: true
    title: NACA pamięta
    text: Laboratoria NACA zapamiętały, kto oddał samoloty doświadczalne wojsku.
    effects:
      - registry:
          key: uraza-naca
          type: grudge
          title: Laboratoria NACA pamiętają, że Anderson oddał samoloty doświadczalne Lotnictwu
          with: [RN, brandt]
          visible: false

  - id: lotnictwo-samoloty-wynik
    on: [lotnictwo-kontra-naca.lotnictwo]
    after: 3
    title: Samoloty doświadczalne pod Lotnictwem
    text: >-
      Program samolotów doświadczalnych idzie szybciej, odkąd płaci za niego Lotnictwo.
      Raporty z lotów dostają klauzulę, zanim wyschnie atrament, a inżynierowie NACA czytają
      o własnych pomiarach w streszczeniach.
    effects:
      - { var: presja_wyscigu, add: 1 }
      - { indicator: SO, add: -1 }

  - id: naca-odwdziecza-sie
    on: [lotnictwo-kontra-naca.naca]
    after: 3
    title: Tunel naddźwiękowy dla PACE
    text: >-
      Laboratorium w Langley oddaje PACE dwie zmiany tygodniowo w tunelu naddźwiękowym, poza
      kolejką. Kierownik tunelu mówi, że to „za zeszłoroczną sprawę”.
    effects:
      - { var: pula_kadr, add: 1 }
      - registry:
          key: zasluga-naca
          type: merit
          title: NACA odwdzięcza się za poparcie w sporze z Lotnictwem
          with: [RN]

  - id: komitet-pierwszy-raport
    on: [lotnictwo-kontra-naca.wspolny-komitet]
    after: 2
    title: Wspólny komitet wydaje pierwszy raport
    text: >-
      Wspólny komitet Lotnictwa i NACA wydaje pierwszy raport, podpisany przez obie strony.
      Nikt nie jest z niego dumny, ale wszyscy się na niego powołują.
    effects:
      - { indicator: SO, add: 2 }

  - id: pentagon-rozstrzygnal
    on: [lotnictwo-kontra-naca.nie-angazowac, lotnictwo-kontra-naca.biernosc]
    after: 2
    title: Spory omijają PACE
    text: >-
      Następny spór o podział programów trafia od razu do Pentagonu. Do PACE przychodzi tylko
      kopia rozstrzygnięcia, „do wiadomości”.
    effects:
      - { indicator: SO, add: -1 }
      - registry:
          key: precedens-pentagon
          type: precedent
          title: 'Precedens: spory między wojskiem a nauką rozstrzyga Pentagon, nie PACE'
          with: [DPO, RN]

  # ── Maszyna licząca ────────────────────────────────────────────────────────────────
  - id: maszyna-instalacja
    on: [zakup-komputera.kupic]
    after: 1
    title: Maszyna licząca przyjeżdża w skrzyniach
    text: >-
      Maszyna licząca przyjeżdża koleją w kilkunastu skrzyniach. Potrzebuje własnej hali,
      chłodzenia i tyle prądu, ile zużywa małe miasteczko. Ruskin przenosi warsztat
      mechaniczny, żeby zrobić jej miejsce.
    effects:
      - { faction: DOI, disposition: -1 }
      - correction: { units: -0.3, quarters: 1, reason: 'Hala, chłodzenie i zasilanie dla maszyny liczącej' }

  - id: maszyna-pierwsze-obliczenia
    on: [zakup-komputera.kupic]
    after: 3
    title: Trajektoria policzona przed obiadem
    text: >-
      Maszyna licząca oddaje pierwszą pełną trajektorię: obliczenie, które zespół rachmistrzyń
      robił trzy tygodnie, zajęło jej przedpołudnie. Rachmistrzynie uczą się teraz pisać
      dla niej instrukcje. Gazety nazywają ją „mózgiem elektronowym”.
    effects:
      - { faction: RN, disposition: 1 }
      - { indicator: PP, add: 1 }
      - { flag: pace_ma_maszyne }

  - id: maszyna-kolejka
    on: [zakup-komputera.kupic]
    after: 5
    title: Kolejka do maszyny liczącej
    text: >-
      Lotnictwo prosi o nocną zmianę przy maszynie liczącej do własnych obliczeń. Rada Naukowa
      chce wiedzieć, co wojsko liczy na jej maszynie. Odpowiedź brzmi: „tablice”.
    effects:
      - { faction: DPO, disposition: 1 }
      - registry:
          key: maszyna-nocna-zmiana
          type: debt
          title: Lotnictwo jest winne PACE przysługę za nocne zmiany przy maszynie liczącej
          with: [DPO]

  - id: dzierzawa-kolejka
    on: [zakup-komputera.dzierzawa]
    after: 2
    title: W kolejce za Biurem Spisu
    text: >-
      Obliczenia do najbliższej próby czekają w kolejce za Biurem Spisu Ludności i dwiema
      firmami ubezpieczeniowymi. Wyniki przychodzą pocztą, trzy tygodnie po terminie.
    effects:
      - { indicator: SO, add: -1 }

  - id: suwaki-zostaja
    on: [zakup-komputera.odmowic, zakup-komputera.biernosc]
    after: 3
    title: Matematycy odchodzą do maszyny
    text: >-
      Maszynę, której nie kupiła PACE, kupuje laboratorium Lotnictwa. Dwóch młodych matematyków
      z zespołu obliczeniowego składa wypowiedzenia tego samego dnia. Chcą pracować tam,
      gdzie stoi maszyna.
    effects:
      - { var: pula_kadr, add: -1 }
      - registry:
          key: uraza-maszyna
          type: grudge
          title: Brandt pamięta odmowę zakupu maszyny liczącej
          with: [brandt, RN]
          visible: false

  # ── Fundusz transatlantycki ────────────────────────────────────────────────────────
  - id: fundusz-stacje
    on: [fundusz-transatlantycki.wplacic]
    after: 3
    title: Fundusz stawia pierwsze stacje
    text: >-
      Z funduszu transatlantyckiego powstają stacje pomiarowe w Norwegii i we Włoszech.
      Na tabliczkach przy wejściu jest skrót PACE, a pod nim nazwy sześciu krajów.
    effects:
      - { indicator: WF, add: 2 }
      - { var: jednosc_zachodu, add: 1 }
      - registry:
          key: zasluga-fundusz
          type: merit
          title: Sojusznicy pamiętają, że PACE wpłaciła do funduszu bez warunków
          with: [anderson]

  - id: fundusz-warunki-wracaja
    on: [fundusz-transatlantycki.warunkowo]
    after: 2
    title: Sojusznicy liczą kontrakty z funduszu
    text: >-
      Delegaci europejscy podliczają pierwszy rok funduszu: cztery piąte zamówień trafiło
      do firm amerykańskich. W Radzie Atlantyckiej pada słowo „fasada”.
    effects:
      - { var: jednosc_zachodu, add: -1 }
      - { indicator: WF, add: -1 }
      - registry:
          key: uraza-fundusz
          type: grudge
          title: Delegaci europejscy uważają fundusz za sposób na dotowanie amerykańskich firm
          with: [anderson]
          visible: false

  - id: fundusz-bez-pace
    on: [fundusz-transatlantycki.odmowic, fundusz-transatlantycki.biernosc]
    after: 3
    title: Fundusz działa bez PACE
    text: >-
      Fundusz badań wysokich warstw atmosfery rusza bez PACE, z siedzibą w Londynie.
      Pierwsze stypendia dostają uczeni, którzy rok wcześniej pisali podania do Andersona.
    effects:
      - { var: sila_wielkiej_brytanii, add: 1 }
      - { indicator: WF, add: -1 }

  # ── Uciekinier ze Wschodu ──────────────────────────────────────────────────────────
  - id: uciekinier-notatki
    on: [uciekinier.zatrudnic]
    after: 2
    chance: 0.7
    title: Notatki uciekiniera się potwierdzają
    text: >-
      Zespół silnikowy sprawdził notatki uciekiniera na stanowisku prób. Liczby się zgadzają.
      Po raz pierwszy wiadomo, z jakim ciśnieniem w komorze pracują po tamtej stronie.
    effects:
      - { faction: RN, disposition: 1 }
      - { var: presja_wyscigu, add: 1 }

  - id: uciekinier-watpliwosci
    on: [uciekinier.zatrudnic]
    after: 4
    chance: 0.4
    title: BAS ma wątpliwości co do uciekiniera
    text: >-
      Biuro Analiz Specjalnych znajduje w życiorysie uciekiniera dwa lata, których nie umie
      potwierdzić. Dorothy Ames nie mówi, że to agent. Mówi, że nie umie powiedzieć, że nie.
    effects:
      - { faction: BAS, disposition: -1 }
      - registry:
          key: watpliwosci-uciekinier
          type: secret
          title: 'Tajemnica: BAS nie umie potwierdzić życiorysu uciekiniera zatrudnionego w PACE'
          with: [anderson, ames, BAS]
          weight: 2

  - id: uciekinier-streszczenie
    on: [uciekinier.przekazac-bas, uciekinier.biernosc]
    after: 3
    title: Cztery strony z dwustu godzin
    text: >-
      BAS przysyła streszczenie przesłuchań uciekiniera: cztery strony z dwustu godzin rozmów.
      Rada Naukowa pyta o resztę. Reszta jest „w opracowaniu”.
    effects:
      - { faction: RN, disposition: -1 }
      - registry:
          key: dlug-bas-protokoly
          type: debt
          title: BAS jest winne PACE pełne protokoły przesłuchań uciekiniera
          with: [BAS, ames]

  - id: uciekinier-u-konkurencji
    on: [uciekinier.odeslac]
    after: 3
    title: Uciekinier pracuje dla Brytyjczyków
    text: >-
      Inżynier, którego PACE nie chciała, pracuje w brytyjskim ośrodku rakietowym. Londyn
      przysyła uprzejme podziękowanie za „wskazanie kandydata”.
    effects:
      - { var: sila_wielkiej_brytanii, add: 1 }

  # ── Senator i zakład w jego stanie ─────────────────────────────────────────────────
  - id: senator-dlug
    on: [senator-z-okregu.zgodzic-sie]
    after: 0
    silent: true
    title: Dług senatora
    text: Senator z komisji środków jest winien PACE głos.
    effects:
      - registry:
          key: dlug-senatora
          type: debt
          title: Senator z komisji środków jest winien PACE głos za halę w swoim stanie
          with: [anderson]

  - id: senator-splaca
    on: [senator-z-okregu.zgodzic-sie]
    after: 3
    requires: { registry: dlug-senatora }
    title: Senator spłaca dług
    text: >-
      W komisji środków pada wniosek o obcięcie budżetu PACE o dziesiątą część. Senator,
      w którego stanie stoi nowa hala, prosi o głos i mówi przez czterdzieści minut. Wniosek
      przepada.
    effects:
      - { indicator: ZW, add: 2 }
      - { registryClose: dlug-senatora }

  - id: hala-w-polu
    on: [senator-z-okregu.zgodzic-sie]
    after: 4
    title: Hala daleko od torów
    text: >-
      Nowa hala montażowa stoi sześćdziesiąt kilometrów od najbliższej bocznicy. Każdy człon
      rakiety jedzie do niej dwa dni ciężarówką, pod eskortą policji stanowej.
    effects:
      - { faction: DOI, disposition: -1 }
      - correction: { units: -0.2, quarters: 2, reason: 'Transport do hali montażowej w stanie senatora' }

  - id: senator-pamieta
    on: [senator-z-okregu.odmowic, senator-z-okregu.biernosc]
    after: 3
    title: Senator dopisuje jeden paragraf
    text: >-
      Do ustawy budżetowej trafia paragraf, który każe PACE składać komisji środków
      sprawozdanie co kwartał, z wykazem każdej inwestycji powyżej stu tysięcy dolarów.
      Autorem poprawki jest senator, któremu odmówiono hali.
    effects:
      - { indicator: ZW, add: -2 }
      - registry:
          key: uraza-senatora
          type: grudge
          title: Senator z komisji środków pamięta odmowę w sprawie hali
          with: [anderson]

  - id: senator-notes
    on: [senator-z-okregu.obiecac]
    after: 0
    silent: true
    title: Obietnica w notesie senatora
    text: Anderson obiecał senatorowi następną inwestycję.
    effects:
      - registry:
          key: obietnica-senatorowi
          type: promise
          title: 'Obietnica: następna inwestycja PACE trafi do stanu senatora z komisji środków'
          with: [anderson]

  - id: senator-przypomina
    on: [senator-z-okregu.obiecac]
    after: 4
    requires: { registry: obietnica-senatorowi }
    title: Senator otwiera notes
    text: >-
      Senator dzwoni osobiście i czyta datę z notesu. PACE umieszcza w jego stanie magazyn
      części zamiennych. Jest mniejszy niż hala, ale ma tabliczkę i przecięcie wstęgi.
    effects:
      - { indicator: ZW, add: 1 }
      - { registryClose: obietnica-senatorowi }
      - correction: { units: -0.2, quarters: 1, reason: 'Magazyn części w stanie senatora (spełniona obietnica)' }

  # ── Kamery na poligonie ────────────────────────────────────────────────────────────
  - id: telewizja-listy
    on: [telewizja-na-poligonie.wpuscic]
    after: 1
    title: Worki listów po programie
    text: >-
      Po wieczornym programie o próbie PACE poczta przywozi worki listów. Dzieci pytają,
      jak zostać inżynierem rakietowym, a dwie szkoły proszą o wycieczkę.
    effects:
      - { indicator: PP, add: 2 }

  - id: telewizja-chce-wiecej
    on: [telewizja-na-poligonie.wpuscic]
    after: 3
    title: Stacja chce stałego programu
    text: >-
      Stacja telewizyjna proponuje stały program z poligonu, raz w miesiącu. Dorothy Ames
      pisze w tej sprawie jedno zdanie: raz wpuszczonej kamery nie da się już wyprosić.
    effects:
      - { faction: BAS, disposition: -1 }
      - registry:
          key: precedens-kamery
          type: precedent
          title: 'Precedens: kamery były już na poligonie, więc prasa oczekuje ich przy każdej próbie'
          with: [BAS]

  - id: telewizja-film-w-szkolach
    on: [telewizja-na-poligonie.film]
    after: 3
    title: Film PACE krąży po szkołach
    text: >-
      Film z próby, zmontowany przez biuro prasowe, krąży po szkołach i klubach
      weteranów. Nikt nie pyta, czego w nim nie pokazano.
    effects:
      - { indicator: PP, add: 1 }

  - id: telewizja-reporter-wraca
    on: [telewizja-na-poligonie.odmowic]
    after: 2
    title: Reportaż zza płotu
    text: >-
      Reporter, którego nie wpuszczono na poligon, robi materiał z drugiej strony ogrodzenia.
      Farmerzy opowiadają o nocnych hukach, a kamera długo pokazuje tablicę z zakazem wstępu.
    effects:
      - { indicator: PP, add: -2 }
      - { indicator: WF, add: -1 }

  # ── Algieria: Hammaguir ────────────────────────────────────────────────────────────
  - id: hammaguir-zdjecie
    on: [algieria.philippeville.wojsko]
    after: 2
    title: Zdjęcie z bramy poligonu
    text: >-
      Zdjęcie legionistów pod tablicą PACE w Hammaguir obiega prasę arabską i trafia na salę
      obrad ONZ. Delegat Indii pyta, co komisja pokojowych eksperymentów robi za drutem
      kolczastym.
    effects:
      - { indicator: WF, add: -2 }
      - { var: dekolonizacja, add: 1 }

  - id: hammaguir-tlok-w-woomerze
    on: [algieria.philippeville.przeniesc]
    after: 2
    title: Tłok w Woomerze
    text: >-
      Po przeniesieniu prób z Sahary harmonogram Woomery jest pełny na pół roku naprzód.
      Australijczycy są zadowoleni z opłat, a Paryż liczy każdy pusty tydzień w Hammaguir.
    effects:
      - { var: sila_wielkiej_brytanii, add: 1 }
      - { indicator: SO, add: -1 }

  - id: hammaguir-konwoj
    on: [algieria.philippeville.bez-zmian, algieria.philippeville.biernosc]
    after: 3
    chance: 0.5
    title: Konwój na drodze do Hammaguir
    text: >-
      Konwój z paliwem dla poligonu zostaje ostrzelany na drodze z Colomb-Béchar. Nikt nie
      ginie, ale dwie cysterny płoną do rana. Sahara okazała się mniejsza, niż zakładano.
    effects:
      - { indicator: SO, add: -1 }
      - correction: { units: -0.4, quarters: 1, reason: 'Straty po ataku na konwój do Hammaguir' }

  # ── Brytyjska próba atomowa ────────────────────────────────────────────────────────
  - id: hurricane-tajemnica
    on: [bomba-brytyjska.hurricane.zgoda]
    after: 0
    silent: true
    title: Pomiary brytyjskiej próby
    text: Stacje PACE mierzyły brytyjską próbę atomową.
    effects:
      - registry:
          key: pomiary-hurricane
          type: secret
          title: 'Tajemnica: stacje „meteorologiczne” PACE w Woomerze mierzyły brytyjską próbę atomową'
          with: [anderson, ames, BAS]
          weight: 2

  - id: hurricane-rewanz
    on: [bomba-brytyjska.hurricane.zgoda]
    after: 2
    title: Londyn pamięta o Woomerze
    text: >-
      Brytyjczycy przejmują część kosztów stacji śledzących w Woomerze i dają próbom PACE
      pierwszeństwo w kalendarzu poligonu. W piśmie nie ma słowa o powodach.
    effects:
      - correction: { units: 0.3, quarters: 2, reason: 'Brytyjski udział w kosztach stacji w Woomerze' }

  - id: hurricane-przeciek
    on: [bomba-brytyjska.hurricane.zgoda]
    after: 3
    chance: 0.5
    requires: { registry: pomiary-hurricane }
    title: 'Gazeta pisze: stacje PACE mierzyły bombę'
    text: >-
      Londyński dziennik pisze, że „pomiary meteorologiczne” PACE w Woomerze były pomiarami
      fali uderzeniowej po próbie atomowej. Rada Naukowa dowiaduje się o tym z gazety.
    effects:
      - { indicator: WF, add: -3 }
      - { faction: RN, disposition: -1 }
      - { registryClose: pomiary-hurricane, as: revealed }

  - id: hurricane-na-pismie
    on: [bomba-brytyjska.hurricane.odmowa, bomba-brytyjska.hurricane.biernosc]
    after: 2
    title: Woomera według cennika
    text: >-
      Po odmowie w sprawie próby atomowej Londyn rozlicza PACE z każdej godziny na poligonie
      w Woomerze. Okna startowe trzeba zamawiać z kwartalnym wyprzedzeniem, na formularzu.
    effects:
      - { faction: DOI, disposition: -1 }
      - correction: { units: -0.2, quarters: 2, reason: 'Wyższe opłaty i sztywny kalendarz w Woomerze' }

  # ── Hiroszima ──────────────────────────────────────────────────────────────────────
  - id: hiroszima-teczka
    on: [echo-antyatomowe.hiroszima.delegat]
    after: 0
    silent: true
    title: Teczka po Hiroszimie
    text: W Waszyngtonie założono teczkę uczonemu, który mówił w Hiroszimie.
    effects:
      - registry:
          key: teczka-hiroszima
          type: hook
          title: W Waszyngtonie jest teczka uczonego Rady Naukowej, który przemawiał w Hiroszimie
          with: [BAS, ames]
          visible: false

  - id: hiroszima-zaproszenia
    on: [echo-antyatomowe.hiroszima.delegat]
    after: 2
    title: Listy z Tokio i Bombaju
    text: >-
      Po wystąpieniu w Hiroszimie do Rady Naukowej piszą uczelnie z Tokio i Bombaju. Proszą
      o miejsce dla swoich aparatów w rakietach sondujących PACE.
    effects:
      - { indicator: WF, add: 1 }
      - { var: pula_kadr, add: 1 }

  - id: hiroszima-wyjasnienia
    on: [echo-antyatomowe.hiroszima.delegat]
    after: 3
    requires:
      all:
        - { registry: teczka-hiroszima }
        - { var: antykomunizm, op: '>=', value: 6 }
    title: Uczony z Hiroszimy składa wyjaśnienia
    text: >-
      Fizyk, który mówił w Hiroszimie, dostaje wezwanie do złożenia wyjaśnień w sprawie
      „kontaktów z organizacjami o charakterze wywrotowym”. Jego poświadczenie bezpieczeństwa
      zostaje zawieszone do odwołania.
    effects:
      - { faction: RN, disposition: -1 }
      - { indicator: SO, add: -2 }
      - { registryClose: teczka-hiroszima, as: revealed }

  - id: hiroszima-puste-krzeslo
    on: [echo-antyatomowe.hiroszima.odmowa]
    after: 2
    title: Puste krzesło japońskiego obserwatora
    text: >-
      Japoński obserwator nie przyjeżdża na dwa kolejne posiedzenia Rady Atlantyckiej.
      Poselstwo tłumaczy to „nawałem obowiązków”.
    effects:
      - { indicator: WF, add: -1 }

  # ── Dien Bien Phu ──────────────────────────────────────────────────────────────────
  - id: indochiny-tablice
    on: [indochiny-1954.vulture.pomoc]
    after: 2
    chance: 0.6
