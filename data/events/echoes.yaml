    on: [stal-1952.strajk.kary]
    after: 3
    title: Oferty z zapasem na kary
    text: >-
      W następnym przetargu wszystkie oferty są droższe o kilkanaście procent. Dostawcy
      doliczyli „rezerwę na ryzyko umowne”. Słowa „kary” nie używa nikt.
    effects:
      - correction: { units: -0.3, quarters: 2, reason: 'Droższe oferty po egzekwowaniu kar umownych' }
      - registry:
          key: uraza-dostawcow
          type: grudge
          title: Prezesi firm dostawczych pamiętają kary naliczone po strajku hutników
          with: [PRZ, haskell]
          visible: false

  # ── Triest ─────────────────────────────────────────────────────────────────────────
  - id: wloska-aparatura
    on: [triest.weto.kontrakt]
    after: 3
    title: Aparatura z Turynu
    text: >-
      Aparatura zamówiona we Włoszech przychodzi dwa miesiące po terminie. Działa bez zarzutu,
      ale instrukcje są po włosku. Ruskin szuka tłumacza wśród mechaników.
    effects:
      - { faction: DOI, disposition: -1 }

  - id: wlosi-obietnica
    on: [triest.weto.obietnica]
    after: 0
    silent: true
    title: Obietnica dla Rzymu
    text: Anderson obiecał Włochom miejsce w następnym programie.
    effects:
      - registry:
          key: obietnica-wlochom
          type: promise
          title: 'Obietnica w protokole: udział włoskiego przemysłu w następnym programie PACE'
          with: [anderson]

  - id: wlosi-przypominaja
    on: [triest.weto.obietnica]
    after: 4
    requires: { registry: obietnica-wlochom }
    title: Rzym przypomina o obietnicy
    text: >-
      Delegat Włoch kładzie na stole wyciąg z protokołu sprzed roku. PACE zamawia w Mediolanie
      osprzęt naziemny do następnego programu. Obietnica zostaje spełniona co do litery.
    effects:
      - { indicator: WF, add: 1 }
      - { registryClose: obietnica-wlochom }
      - correction: { units: -0.2, quarters: 2, reason: 'Zamówienie we Włoszech (spełniona obietnica)' }

  - id: rzym-glosuje-przeciw
    on: [triest.weto.odmowa, triest.weto.biernosc]
    after: 2
    title: Włoski głos przeciw
    text: >-
      W głosowaniu nad regulaminem przetargów Włochy są przeciw, pierwszy raz w historii
      komisji. Wniosek przechodzi, ale jednomyślności już nie ma.
    effects:
      - { indicator: SO, add: -1 }
      - { indicator: WF, add: -1 }

  # ── Nowa administracja: przegląd programów ─────────────────────────────────────────
  - id: kontrolerzy-lista
    on: [wybory-1952.przeglad.wspolpraca, wybory-1952.przeglad.biernosc]
    after: 2
    title: Czternaście pozycji do wyjaśnienia
    text: >-
      Kontrolerzy Biura Budżetu wracają z listą czternastu pozycji „do wyjaśnienia”. Ruskin
      liczy, że odpowiedzi zajmą jego ludziom sześć tygodni. Waszyngton docenia, że księgi
      były otwarte.
    effects:
      - { indicator: ZW, add: 1 }
      - correction: { units: -0.3, quarters: 2, reason: 'Pozycje zakwestionowane przez kontrolerów' }

  - id: bialy-dom-pamieta
    on: [wybory-1952.przeglad.sojusznicy]
    after: 0
    silent: true
    title: Biały Dom zapamiętał
    text: Biały Dom zapamiętał, że Anderson zasłonił się umową międzynarodową.
    effects:
      - registry:
          key: uraza-bialego-domu
          type: grudge
          title: W Białym Domu pamiętają, że Anderson zasłonił PACE umową międzynarodową
          with: [anderson]
          weight: 2
          visible: false

  - id: rada-rezolucja
    on: [wybory-1952.przeglad.sojusznicy]
    after: 2
    title: Rezolucja Rady Atlantyckiej
    text: >-
      Rada Atlantycka uchwala rezolucję: budżet PACE jest zobowiązaniem wszystkich członków
      i nie podlega jednostronnym zmianom. Głosują za nią wszyscy poza delegatem Stanów
      Zjednoczonych, który się wstrzymuje.
    effects:
      - { indicator: WF, add: 1 }
      - { indicator: SO, add: 1 }

  - id: wojsko-zamowienia
    on: [wybory-1952.przeglad.wojsko]
    after: 2
    title: Pentagon zamawia serię prób
    text: >-
      Pentagon zamawia w PACE serię prób materiałów i przyrządów. Pieniądze są pewne, a wyniki
      dostają klauzulę. Brandt pyta, ile jeszcze takich zamówień, zanim komisja stanie się
      poligonem wojska.
    effects:
      - { faction: RN, disposition: -1 }
      - { indicator: WF, add: -1 }
      - correction: { units: 0.4, quarters: 2, reason: 'Zamówienia Pentagonu na próby w PACE' }

  # ── Echa wydarzeń losowych ─────────────────────────────────────────────────────────
  - id: geniusz-sekcja
    on: [geniusz-z-prowincji]
    after: 4
    title: Student z prowincji prowadzi sekcję
    text: >-
      Inżynier z małej uczelni na Środkowym Zachodzie po roku w PACE prowadzi własną sekcję.
      Ściągnął do niej trzech kolegów z roku.
    effects:
      - { var: pula_kadr, add: 1 }

  - id: reportaz-podania
    on: [reportaz-tygodnika]
    after: 1
    title: Podania po reportażu
    text: >-
      Po reportażu w tygodniku dział kadr PACE dostaje cztery razy więcej podań niż zwykle.
      Większość zaczyna się od zdania „widziałem zdjęcia”.
    effects:
      - { var: pula_kadr, add: 1 }

  - id: kontrolerzy-przesluchanie
    on: [raport-kontrolerow]
    after: 2
    title: Raport kontrolerów trafia na przesłuchanie
    text: >-
      Raport o zamówieniach bez przetargu trafia na przesłuchanie w podkomisji. Haskell
      siedzi w drugim rzędzie i notuje, kto z PACE broni dostawców, a kto patrzy w stół.
    effects:
      - { indicator: ZW, add: -1 }

  # ── Loty: zatajona awaria (kolejkuje silnik przy rozliczaniu Raportów Misji) ───────
  - id: przeciek-zatajonej-awarii
    after: 2
    chance: 0.35
    requires: { registry: zatajona-awaria }
    title: Zatajona awaria wychodzi na jaw
    text: >-
      Tygodnik drukuje zdjęcie wraku na pustyni i datę, której nie ma w żadnym komunikacie
      PACE. Rzecznik komisji potrzebuje dwóch dni, żeby znaleźć słowo „incydent”.
    effects:
      - { indicator: PP, add: -3 }
      - { indicator: WF, add: -2 }
      - { registryClose: zatajona-awaria, as: revealed }

  - id: zatajona-awaria-przycicha
    after: 6
    silent: true
    requires: { registry: zatajona-awaria }
    title: Zatajona awaria przycicha
    text: O zatajonej awarii nikt już nie pyta.
    effects:
      - { registryClose: zatajona-awaria }
