# Świat: regiony i zmienne świata (decyzja 0015).
#
# Zmienne są UKRYTE przed graczem. Gracz widzi je pośrednio: w raportach, cenach,
# depeszach i ocenach wywiadu. Na ekranie zostaje pięć wskaźników z GDD (zasada Z6).
# Skala zmiennych 0–10, gdzie 5 to „normalnie”.

regions:
  - id: usa
    title: Stany Zjednoczone
  - id: europa
    title: Europa Zachodnia
  - id: bliski_wschod
    title: Bliski Wschód
  - id: azja
    title: Azja i Pacyfik
  - id: zsrr
    title: ZSRR i blok wschodni
  - id: swiat
    title: Świat (sprawy globalne)

variables:
  - id: koniunktura
    title: Koniunktura
    min: 0
    max: 10
    initial: 6
    description: >-
      Stan gospodarki Zachodu (mnożnik EC z pliku wydarzeń 1951). Wpływa na wielkość budżetu,
      ceny w przetargach i Korekty. Wojna w Korei na start podbija koniunkturę.
  - id: pula_kadr
    title: Pula kadr
    min: 0
    max: 10
    initial: 5
    description: >-
      Dostępność inżynierów i naukowców (mnożnik PEL). Niska pula zwiększa ryzyko drenażu mózgów
      i podnosi koszt zatrudnienia.
  - id: popyt_na_rope
    title: Popyt na ropę
    min: 0
    max: 10
    initial: 6
    description: Napędza kryzysy surowcowe (wątek Abadan i szablon kryzysu surowcowego).
  - id: sila_wielkiej_brytanii
    title: Siła i determinacja Wielkiej Brytanii
    min: 0
    max: 10
    initial: 6
    description: >-
      Gospodarka, rząd i imperialne ambicje Londynu. Wysoka wartość sprzyja twardym gałęziom
      (np. plan Buccaneer w Abadanie), ale każda wojna ją obniża.
  - id: zaangazowanie_usa
    title: Zaangażowanie USA za granicą
    min: 0
    max: 10
    initial: 5
    description: Skłonność Waszyngtonu do mediacji, pomocy i operacji wywiadu.
  - id: antykomunizm
    title: Gorączka antykomunistyczna
    min: 0
    max: 10
    initial: 7
    description: Siła maccartyzmu i nastrojów antykomunistycznych w USA.
  - id: napiecie_azja
    title: Napięcie w Azji
    min: 0
    max: 10
    initial: 7
    description: >-
      Korea, Indochiny, Cieśnina Tajwańska, później Wietnam. Wysokie napięcie podbija budżety
      obronne i odciąga uwagę Waszyngtonu od Europy.
  - id: presja_wyscigu
    title: Presja wyścigu
    min: 0
    max: 10
    initial: 2
    description: >-
      Odczuwana presja rywalizacji ze ZSRR (mnożnik RP). Rośnie z sukcesami radzieckimi;
      później połączona z Bilansem Wyścigu.

  - id: jednosc_bloku
    title: Jedność bloku wschodniego
    min: 0
    max: 10
    initial: 8
    description: >-
      Spójność państw pod kontrolą Moskwy. Spada po buntach (NRD 1953, Polska i Węgry 1956)
      i po sporach z Pekinem. Niska jedność otwiera drogę uciekinierom i pęknięciom w bloku.
  - id: jednosc_zachodu
    title: Jedność Zachodu
    min: 0
    max: 10
    initial: 6
    description: >-
      Spójność sojuszu atlantyckiego: spory o uzbrojenie Niemiec, o koszty i o przywództwo.
      Niska jedność utrudnia wspólne finansowanie PACE.
  - id: ambicja_francji
    title: Ambicja Francji
    min: 0
    max: 10
    initial: 4
    description: >-
      Dążenie Paryża do niezależności: własna bomba, własna rakieta, własne weto. Rośnie po
      upokorzeniach (Indochiny, Suez) i z powrotem de Gaulle'a.
  - id: kurs_kremla
    title: Kurs Kremla
    min: 0
    max: 10
    initial: 8
    description: >-
      Od odwilży (0) do twardego kursu (10). Steruje Napięciem Geopolitycznym i modelem ZSRR.
      Na początku 1951 roku rządzi Stalin, więc kurs jest twardy.
  - id: wyscig_atomowy
    title: Wyścig atomowy
    min: 0
    max: 10
    initial: 5
    description: >-
      Tempo prób i zbrojeń jądrowych. Rośnie z każdą nową bombą i próbą, spada po moratoriach
      i traktatach. Wysoki poziom wzmacnia żądania Dyrektoriatu Programów Obronnych.
  - id: nastroje_spoleczne
    title: Niepokoje społeczne w USA
    min: 0
    max: 10
    initial: 3
    description: >-
      Napięcia w społeczeństwie amerykańskim: prawa obywatelskie, strajki, później ruch
      antywojenny. Wysoki poziom odbiera drogim programom poparcie opinii publicznej.
  - id: dekolonizacja
    title: Tempo dekolonizacji
    min: 0
    max: 10
    initial: 3
    description: >-
      Tempo rozpadu imperiów kolonialnych. Rośnie po Indochinach, Bandungu i Algierii.
      Osłabia Londyn i Paryż, a nowym państwom daje głos w ONZ.

# Najwięcej samodzielnych dylematów czekających naraz. Decyzje etapów wątków nie liczą się do limitu.
maxPendingDilemmas: 2
