id: abadan
title: Kryzys irański
kind: historical
region: bliski_wschod
exclusiveGroup: surowce
summary: >-
  Iran nacjonalizuje przemysł naftowy, a największa rafineria świata w Abadanie staje.
  Wielka Brytania broni swoich koncesji, USA wahają się między mediacją a operacją wywiadu.
historicalNote: >-
  Zabójstwo premiera Razmary (7 marca 1951) i ustawa nacjonalizacyjna w Madżlisie (15 marca).
  Mosaddegh premierem (28 kwietnia), ustawa wchodzi w życie 1 maja 1951. Misja Harrimana
  (lipiec–sierpień 1951). Rozważany i niewykonany plan Buccaneer; ewakuacja Brytyjczyków
  z Abadanu (3–4 października 1951). Dymisja i powrót Mosaddegha po zamieszkach 21 lipca 1952;
  Trybunał w Hadze uznaje brak swojej jurysdykcji (22 lipca 1952). Zerwanie stosunków
  z Wielką Brytanią (22 października 1952). Zamach stanu przygotowany przez CIA i brytyjski
  wywiad (operacja Ajax/Boot, 19 sierpnia 1953). Umowa z konsorcjum naftowym (1954).
drivers: [sila_wielkiej_brytanii, zaangazowanie_usa, popyt_na_rope]
start:
  from: 1951-Q1
stages:
  - id: razmara
    title: zabójstwo premiera
    at: 1951-Q1
    branches:
      - id: zamach
        title: Premier Razmara zastrzelony
        historical: true
        weight: 10
        text: >-
          Premier Iranu, przeciwnik nacjonalizacji ropy, ginie w zamachu w teherańskim meczecie.
          Tydzień później parlament uchwala przejęcie przemysłu naftowego.

  - id: nacjonalizacja
    title: nacjonalizacja ropy
    at: 1951-Q2
    branches:
      - id: mosaddegh
        title: Mosaddegh premierem, ropa znacjonalizowana
        historical: true
        weight: 10
        effects:
          - { var: popyt_na_rope, add: 1 }
          - { flag: iran_nacjonalizacja }
        text: >-
          Premierem zostaje Mohammad Mosaddegh, a ustawa o nacjonalizacji wchodzi w życie.
          Brytyjska spółka traci koncesję i największą rafinerię świata.
        reactions:
          - actor: Londyn
            text: >-
              Rząd brytyjski mówi o kradzieży, wysyła krążownik do Zatoki Perskiej i kieruje
              sprawę do Trybunału w Hadze.
          - actor: Waszyngton
            text: >-
              Departament Stanu radzi Londynowi cierpliwość. Prezydent wysyła do Teheranu
              swojego wysłannika, Averella Harrimana.
          - actor: PRZ
            text: >-
              Konsorcja uprzedzają, że paliwo lotnicze z Abadanu zaopatrywało pół Azji.
              Jeśli rafineria stanie, ceny pójdą w górę wszędzie.

  - id: misja
    title: misja Harrimana
    at: 1951-Q3
    branches:
      - id: fiasko
        title: Mediacja bez wyniku
        historical: true
        weight: 10
        text: >-
          Harriman spędza w Teheranie i Londynie kilka tygodni. Wraca z niczym: Brytyjczycy
          chcą zarządzać ropą, a Irańczycy już im na to nie pozwolą.
      - id: sukces
        title: Udana mediacja USA
        weight: 2
        modifiers:
          - { when: { var: zaangazowanie_usa, op: '>=', value: 7 }, mul: 2 }
        effects:
          - { flag: iran_mediacja }
          - { var: zaangazowanie_usa, add: 1 }
        next: haga
        text: >-
          Harriman doprowadza do tymczasowego porozumienia: ropa znów płynie, a spór
          o odszkodowania trafia do arbitrażu. Londyn przyjmuje to z zaciśniętymi zębami.

  - id: rafineria
    title: Abadan
    at: 1951-Q4
    rumor:
      quartersBefore: 1
      reliability: B
      credibility: 3
      source: allies
      topic: Abadan
      text: >-
        Na Cyprze stoją w gotowości brytyjscy spadochroniarze, a w Zatoce Perskiej zbiera się
        eskadra. Sztab ma gotowy plan zajęcia rafinerii siłą. Rząd w Londynie jest podzielony.
    branches:
      - id: ewakuacja
        title: Embargo i ewakuacja Abadanu
        historical: true
        weight: 10
        effects:
          - { var: koniunktura, add: -1 }
          - { var: sila_wielkiej_brytanii, add: -1 }
        next: haga
        text: >-
          Brytyjczycy ewakuują personel z Abadanu na pokładzie krążownika, a rafineria staje.
          Zachodnie koncerny odmawiają kupowania irańskiej ropy.
        ongoing:
          title: Embargo na irańską ropę
          text: >-
            Abadan stoi, a tankowce omijają Iran. Paliwa, także lotnicze, są droższe, dopóki
            spór się nie rozstrzygnie.
          effects:
            - correction: { units: -0.3, quarters: 1, reason: 'Droższe paliwo: rafineria w Abadanie stoi' }
          until: zamach
          maxQuarters: 9
      - id: buccaneer
        title: Plan Buccaneer wykonany
        weight: 1
        modifiers:
          - { when: { var: sila_wielkiej_brytanii, op: '>=', value: 7 }, mul: 3 }
          - { when: { var: popyt_na_rope, op: '>=', value: 8 }, add: 1 }
          - { when: { var: zaangazowanie_usa, op: '<=', value: 3 }, mul: 2 }
        effects:
          - { indicator: NG, add: -1 }
          - { var: sila_wielkiej_brytanii, add: -1 }
          - { var: jednosc_zachodu, add: -1 }
          - { flag: abadan_wojna }
          - correction: { units: -1, quarters: 4, reason: 'Walki w Zatoce Perskiej podbijają ceny paliw' }
        next: wojna_w_zatoce
        text: >-
          Rząd brytyjski wykonuje plan Buccaneer: spadochroniarze i okręty zajmują Abadan.
          Waszyngton i Paryż protestują, Moskwa grozi, a Rada Atlantycka zbiera się na
          nadzwyczajnym posiedzeniu.

  - id: wojna_w_zatoce
    title: wojna w Zatoce
    at: 1952-Q1
    alternative: true
    branches:
      - id: okupacja
        title: Brytyjska okupacja Chuzestanu
        weight: 5
        effects:
          - { var: sila_wielkiej_brytanii, add: -1 }
          - { divergence: europa, add: 1 }
          - correction: { units: -0.5, quarters: 2, reason: 'Wielka Brytania tnie składkę na PACE, bo płaci za wojnę' }
        next: end
        text: >-
          Brytyjczycy trzymają Abadan i pola naftowe, ale płacą za to krwią i pieniędzmi.
          Londyn zapowiada cięcie składek na programy sojusznicze.
      - id: wycofanie
        title: Wycofanie pod presją USA
        weight: 4
        modifiers:
          - { when: { var: zaangazowanie_usa, op: '>=', value: 6 }, mul: 2 }
        effects:
          - { var: sila_wielkiej_brytanii, add: -2 }
          - { var: zaangazowanie_usa, add: 1 }
        next: zamach
        text: >-
          Pod presją Waszyngtonu Brytyjczycy wycofują się z Abadanu. Upokorzenie Londynu będzie
          długo pamiętane w Radzie Atlantyckiej.
      - id: interwencja_zsrr
        title: Moskwa wchodzi do gry
        weight: 1
        effects:
          - { indicator: NG, add: -1 }
          - { var: presja_wyscigu, add: 1 }
          - { flag: iran_zsrr }
        next: end
        text: >-
          Radzieckie dywizje stają przy granicy Iranu, a irańska lewica wzywa do „bratniej
          pomocy”. Świat wstrzymuje oddech.

  - id: haga
    title: lipiec w Teheranie
    at: 1952-Q3
    branches:
      - id: powrot
        title: Mosaddegh odchodzi i wraca
        historical: true
        weight: 10
        text: >-
          Mosaddegh podaje się do dymisji po sporze z szachem o kontrolę nad armią. Po pięciu
          dniach zamieszek wraca silniejszy. Nazajutrz Trybunał w Hadze orzeka, że spór
          naftowy nie należy do jego jurysdykcji.

  - id: zerwanie
    title: zerwanie z Londynem
    at: 1952-Q4
    branches:
      - id: zerwane
        title: Iran zrywa stosunki z Wielką Brytanią
        historical: true
        weight: 10
        modifiers:
          - { when: { flag: iran_mediacja }, mul: 0.2 }
        text: >-
          Teheran zrywa stosunki dyplomatyczne z Londynem i wydala brytyjskich dyplomatów.
          Wraz z nimi wyjeżdża brytyjska siatka wywiadowcza.
      - id: rozmowy
        title: Rozmowy trwają
        weight: 1
        minor: true
        modifiers:
          - { when: { flag: iran_mediacja }, mul: 20 }
        text: >-
          Mimo napięć Teheran i Londyn nie zrywają rozmów. Arbitraż w sprawie odszkodowań
          ciągnie się miesiącami.

  - id: zamach
    title: los Mosaddegha
    at: 1953-Q3
    rumor:
      quartersBefore: 1
      reliability: C
      credibility: 3
      source: humint
      topic: Teheran
      text: >-
        BAS: wśród oficerów teherańskiego garnizonu krążą pieniądze niewiadomego pochodzenia,
        a szach szykuje wyjazd nad Morze Kaspijskie. Coś się przygotowuje.
    branches:
      - id: obalony
        title: Mosaddegh obalony
        historical: true
        weight: 10
        modifiers:
          - { when: { flag: iran_mediacja }, mul: 0.3 }
        effects:
          - { var: popyt_na_rope, add: -1 }
          - { flag: iran_zamach }
          - { faction: BAS, disposition: 1 }
        text: >-
          Po kilku dniach chaosu w Teheranie Mosaddegh zostaje obalony, a szach wraca do pełni
          władzy. Na Zachodzie mało kto pyta, kto pomógł.
        reactions:
          - actor: BAS
            visibility: secret
            text: >-
              Biuro Analiz Specjalnych odnotowuje w aktach, że operacja kosztowała mniej niż
              jeden bombowiec. Wniosek: takie operacje się opłacają.
      - id: przetrwal
        title: Mosaddegh przetrwał
        weight: 2
        modifiers:
          - { when: { flag: iran_mediacja }, mul: 3 }
        effects:
          - { var: zaangazowanie_usa, add: -1 }
        text: >-
          Próba odsunięcia Mosaddegha kończy się fiaskiem, a szach ucieka do Rzymu. Teheran gra
          na dwa fronty, ale nie zrywa z Zachodem.
      - id: zwrot_na_wschod
        title: Zwrot na Wschód
        weight: 1
        effects:
          - { indicator: NG, add: -1 }
          - { flag: iran_zsrr }
          - { divergence: zsrr, add: 1 }
        text: >-
          Nieudany zamach pcha Teheran w stronę Moskwy. Radzieccy doradcy pojawiają się
          w ministerstwach, a mapa Bliskiego Wschodu zaczyna wyglądać inaczej niż w podręcznikach.

  - id: konsorcjum
    title: ropa wraca na rynek
    at: 1954-Q3
    branches:
      - id: umowa
        title: Umowa z konsorcjum naftowym
        historical: true
        weight: 10
        requires: { branch: abadan.zamach.obalony }
        effects:
          - { var: koniunktura, add: 1 }
          - { var: popyt_na_rope, add: -1 }
        text: >-
          Iran podpisuje umowę z konsorcjum zachodnich koncernów. Brytyjczycy tracą monopol,
          Amerykanie dostają czterdzieści procent, a ropa z Abadanu wraca na rynek.
      - id: impas
        title: Impas naftowy trwa
        weight: 1
        minor: true
        requires: { not: { branch: abadan.zamach.obalony } }
        text: >-
          Irańska ropa wciąż nie znajduje kupców na Zachodzie. Rynek nauczył się żyć bez Abadanu,
          a Kuwejt i Arabia Saudyjska biją rekordy wydobycia.
