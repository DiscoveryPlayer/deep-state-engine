# Wzorce: zdarzenia bez daty, z warunkami (decyzja 0015). Ten sam wzorzec działa
# w 1952 i w 1975 roku. Źródło: plik wydarzeń autora z 1951 roku (numery w polu source),
# po scaleniu duplikatów i poprawkach z docs/research/analiza-pliku-wydarzen-1951.md.
#
# Zasada: wzorzec NIE fabrykuje faktów w KSP (nie niszczy pojazdów, nie zabija pilotów).
# Dotyczy świata poza PACE albo daje Korektę, którą gracz stosuje sam.

patterns:
  - id: strajk-w-przemysle
    title: Strajk w zakładach dostawcy
    category: economic
    region: usa
    chancePerQuarter: 0.06
    chanceModifiers:
      - { when: { var: koniunktura, op: '>=', value: 7 }, mul: 1.5 }
    cooldownQuarters: 4
    effects:
      - correction: { units: -0.3, quarters: 1, reason: 'Opóźnienia dostaw po strajku u dostawcy' }
    text: >-
      Związkowcy w zakładach jednego z dostawców PACE odchodzą od maszyn. Chodzi o płace,
      nie o politykę, ale dostawy staną na kilka tygodni.
    source: wydarzenia 1951, nr 1, 7, 18

  - id: drenaz-mozgow
    title: Drenaż mózgów
    category: economic
    chancePerQuarter: 0.05
    chanceModifiers:
      - { when: { var: pula_kadr, op: '<=', value: 3 }, mul: 2 }
      - { when: { var: koniunktura, op: '>=', value: 7 }, mul: 1.5 }
    cooldownQuarters: 4
    effects:
      - { var: pula_kadr, add: -1 }
      - { faction: RN, disposition: -1 }
    text: >-
      Prywatny przemysł oferuje inżynierom PACE pensje, na które agencja nie może odpowiedzieć.
      Kilku najlepszych ludzi składa wypowiedzenia.
    source: wydarzenia 1951, nr 4

  - id: nowy-rocznik
    title: Nowy rocznik inżynierów
    category: economic
    chancePerQuarter: 0.08
    chanceModifiers:
      - { when: { var: pula_kadr, op: '<=', value: 3 }, mul: 2 }
      - { when: { var: pula_kadr, op: '>=', value: 7 }, mul: 0 }
    cooldownQuarters: 4
    effects:
      - { var: pula_kadr, add: 1 }
    text: >-
      Uczelnie techniczne wypuszczają rekordowy rocznik inżynierów, w tym wielu weteranów
      studiujących dzięki ustawie o prawach żołnierzy. Działy kadr przemysłu i PACE
      ustawiają się w kolejce.
    source: przeciwwaga dla drenażu mózgów (seria symulacji 7.11.2026)

  - id: zimny-lut
    title: Zimny lut
    category: technical
    chancePerQuarter: 0.05
    cooldownQuarters: 6
    effects:
      - correction: { units: -0.2, quarters: 1, reason: 'Wymiana partii wadliwej elektroniki' }
    text: >-
      Kontrola jakości wykrywa w partii elektroniki od dostawcy wadliwe luty, które pękają przy
      wibracjach startowych. Cała seria idzie do wymiany.
    source: wydarzenia 1951, nr 21

  - id: wybuch-na-stanowisku
    title: Wybuch na stanowisku prób u dostawcy
    category: technical
    chancePerQuarter: 0.03
    cooldownQuarters: 8
    effects:
      - { indicator: PP, add: -2 }
    text: >-
      Na stanowisku prób silników u jednego z dostawców dochodzi do wybuchu. Prasa pyta,
      czy rakiety są bezpieczne dla okolicznych mieszkańców.
    source: wydarzenia 1951, nr 23, 36

  - id: przelom-aerodynamiczny
    title: Przełom w tunelu aerodynamicznym
    category: technical
    conditions: { after: 1952-Q3 }
    chancePerQuarter: 0.08
    maxTotal: 1
    effects:
      - { faction: RN, disposition: 1 }
    text: >-
      Badacz z laboratorium aerodynamicznego wykazuje, że opór przy prędkościach okołodźwiękowych
      zależy od rozkładu przekroju całego samolotu. Rada Naukowa mówi o rewolucji w projektowaniu.
    source: wydarzenia 1951, nr 22 (reguła pól, historycznie 1952)

  - id: grypa
    title: Epidemia grypy
    category: social
    chancePerQuarter: 0.02
    cooldownQuarters: 16
    effects:
      - correction: { units: -0.3, quarters: 1, reason: 'Absencja chorobowa w zakładach i na poligonach' }
    text: Epidemia grypy przetrzebia zespoły w zakładach i na poligonach. Harmonogramy się sypią.
    source: wydarzenia 1951, nr 44

  - id: wizyta-dygnitarza
    title: Wizyta dygnitarza
    category: political
    chancePerQuarter: 0.05
    cooldownQuarters: 4
    effects:
      - { indicator: PP, add: 2 }
      - { currency: KP, add: 1 }
    text: >-
      Ważny gość z Waszyngtonu albo ze stolicy sojusznika chce zobaczyć start. Dobre zdjęcia,
      dobre nagłówki i jeden więcej przyjaciel przy stole budżetowym.
    source: wydarzenia 1951, nr 58

  - id: weto-francji
    title: Francja grozi wetem
    category: political
    region: europa
    chancePerQuarter: 0.04
    cooldownQuarters: 6
    effects:
      - { currency: KP, add: -1 }
    text: >-
      Delegacja francuska w Radzie Atlantyckiej zapowiada weto wobec wspólnego finansowania,
      dopóki jej przemysł nie dostanie należnej części kontraktów.
    source: wydarzenia 1951, nr 54

  - id: przeciek-do-prasy
    title: Przeciek do prasy
    category: political
    chancePerQuarter: 0.05
    chanceModifiers:
      - { when: { indicator: WF, op: '<=', value: 50 }, mul: 2 }
    cooldownQuarters: 4
    effects:
      - { indicator: WF, add: -4 }
    text: >-
      Tygodnik ilustrowany publikuje szczegóły programu, który miał pozostać poufny. W BAS trwa
      polowanie na źródło przecieku.
    source: wydarzenia 1951, nr 65

  - id: przesluchanie-kosztow
    title: Przesłuchanie w sprawie kosztów
    category: political
    region: usa
    chancePerQuarter: 0.04
    chanceModifiers:
      - { when: { var: koniunktura, op: '<=', value: 4 }, mul: 2 }
    cooldownQuarters: 6
    effects:
      - { indicator: ZW, add: -3 }
    text: >-
      Komisja Kongresu wzywa przedstawicieli PACE, żeby wyjaśnili koszty programów samolotów
      doświadczalnych. Kamery kronik filmowych już czekają.
    source: wydarzenia 1951, nr 63

  - id: wojna-podjazdowa-sluzb
    title: Wojna podjazdowa Lotnictwa i Marynarki
    category: political
    chancePerQuarter: 0.05
    cooldownQuarters: 6
    effects:
      - { faction: DPO, disposition: -1 }
    text: >-
      Lotnictwo i Marynarka spierają się o to, kto ma prowadzić program rakietowy. Obie Służby
      oczekują, że PACE stanie po ich stronie.
    source: 'wydarzenia 1951, nr 57 (precedens: „bunt admirałów” z 1949 roku)'

  - id: incydent-rozpoznawczy
    title: Incydent z samolotem rozpoznawczym
    category: military
    region: zsrr
    chancePerQuarter: 0.04
    chanceModifiers:
      - { when: { var: presja_wyscigu, op: '>=', value: 5 }, mul: 1.5 }
    cooldownQuarters: 6
    effects:
      - { indicator: NG, add: -1 }
      - { var: presja_wyscigu, add: 1 }
    text: >-
      Radzieckie myśliwce przechwytują zachodni samolot rozpoznawczy nad Morzem Barentsa.
      Moskwa protestuje, a Waszyngton milczy o celu lotu.
    source: wydarzenia 1951, nr 68, 78

  - id: kradziez-dokumentacji
    title: Kradzież dokumentacji
    category: military
    chancePerQuarter: 0.03
    cooldownQuarters: 8
    visibility: secret
    effects:
      - { indicator: WF, add: -2 }
      - { flag: wyciek_do_zsrr }
    text: >-
      BAS ustala, że kopie rysunków jednego z programów trafiły do radzieckiego wywiadu.
      Sprawa jest tajna, a podejrzanych jest wielu.
    source: wydarzenia 1951, nr 28

  - id: fala-ufo
    title: Fala obserwacji „latających talerzy”
    category: social
    region: usa
    conditions:
      all:
        - { after: 1952-Q2 }
        - { before: 1954-Q1 }
    chancePerQuarter: 0.25
    maxTotal: 1
    effects:
      - { indicator: PP, add: 1 }
    text: >-
      Radary nad Waszyngtonem pokazują niezidentyfikowane obiekty, a gazety piszą o latających
      talerzach. Zainteresowanie niebem jeszcze nigdy nie było tak duże.
    source: wydarzenia 1951, nr 38 (historycznie lipiec 1952)

  - id: boom-science-fiction
    title: Boom science fiction
    category: social
    chancePerQuarter: 0.04
    cooldownQuarters: 8
    effects:
      - { indicator: PP, add: 2 }
    text: >-
      Film o locie na Księżyc bije rekordy w kinach, a dzieci budują rakiety z kartonu.
      Poparcie dla programów kosmicznych rośnie.
    source: wydarzenia 1951, nr 40

  - id: zmeczenie-europa
    title: Zmęczenie płaceniem za Europę
    category: political
    region: usa
    chancePerQuarter: 0.04
    chanceModifiers:
      - { when: { var: koniunktura, op: '<=', value: 4 }, mul: 2 }
    cooldownQuarters: 8
    effects:
      - { indicator: ZW, add: -2 }
    text: >-
      Kongresmeni z Środkowego Zachodu pytają, dlaczego amerykański podatnik ma płacić za
      europejskie programy. PACE, jako organizacja międzynarodowa, jest łatwym celem.
    source: wydarzenia 1951, łańcuch E

  # ── Druga partia wzorców (Dossier III, część IV; numery w polu source) ──────────────

  - id: poprawka-budzetowa
    title: Poprawka tnąca budżet
    category: political
    region: usa
    conditions: { indicator: ZW, op: '<=', value: 50 }
    chancePerQuarter: 0.06
    cooldownQuarters: 6
    effects:
      - correction: { units: -0.4, quarters: 2, reason: 'Poprawka w Kongresie tnie jedną z linii budżetu PACE' }
    text: >-
      Kongresman z komisji środków zgłasza poprawkę, która obcina jedną z linii budżetu PACE.
      Przechodzi bez dyskusji, późnym wieczorem, razem z dwudziestoma innymi.
    source: Dossier III, wzorzec 5

  - id: raport-kontrolerow
    title: Raport kontrolerów o przetargach
    category: political
    region: usa
    chancePerQuarter: 0.04
    cooldownQuarters: 8
    effects:
      - { indicator: ZW, add: -2 }
      - { faction: PRZ, disposition: -1 }
    text: >-
      Kontrolerzy rządowi publikują raport o marnotrawstwie w zamówieniach PACE. Wymieniają
      trzy kontrakty przyznane bez przetargu. Konsorcja Przemysłowe mają żal, że Anderson
      ich nie osłonił.
    source: Dossier III, wzorzec 7

  - id: general-z-wizja
    title: Generał z wizją
    category: military
    conditions: { era: II, op: '<=' }
    chancePerQuarter: 0.04
    cooldownQuarters: 8
    effects:
      - { var: presja_wyscigu, add: 1 }
    text: >-
      Młody generał Lotnictwa wygłasza w klubie prasowym odczyt o wojnie prowadzonej rakietami.
      Mówi, że bombowiec jest koniem kawalerii przyszłej wojny. Gazety drukują to z rysunkami.
    source: Dossier III, wzorzec 22

  - id: cwiczenia-obrony-cywilnej
    title: Ćwiczenia obrony cywilnej
    category: social
    region: usa
    conditions: { indicator: NG, op: '<=', value: 3 }
    chancePerQuarter: 0.1
    cooldownQuarters: 6
    effects:
      - { var: antykomunizm, add: 1 }
      - { indicator: PP, add: 1 }
    text: >-
      W miastach wyją syreny, a dzieci w szkołach ćwiczą chowanie się pod ławki. Po takim
      tygodniu nikt w Kongresie nie pyta, po co krajowi rakiety.
    source: Dossier III, wzorzec 25

  - id: spor-o-udzial
    title: Spór o udział przemysłowy
    category: political
    region: europa
    chancePerQuarter: 0.05
    chanceModifiers:
      - { when: { var: jednosc_zachodu, op: '<=', value: 4 }, mul: 2 }
    cooldownQuarters: 6
    effects:
      - { indicator: SO, add: -2 }
    text: >-
      Delegat jednego z państw członkowskich przedstawia w Radzie Atlantyckiej tabelę: jego
      kraj wpłaca osiem procent budżetu, a dostaje trzy procent zamówień. Żąda wyrównania.
    source: Dossier III, wzorzec 43

  - id: spor-o-woomere
    title: Spór o koszty Woomery
    category: political
    chancePerQuarter: 0.03
    cooldownQuarters: 10
    effects:
      - { faction: DOI, disposition: -1 }
      - correction: { units: -0.3, quarters: 1, reason: 'Wyższe opłaty za poligon w Woomerze' }
    text: >-
      Rząd Australii przysyła nowy cennik za korzystanie z poligonu w Woomerze. Zarządcy
      ośrodków liczą i dochodzą do wniosku, że taniej byłoby zbudować własną pustynię.
    source: Dossier III, wzorzec 48

  - id: przekroczenie-kosztow
    title: Dostawca przekracza koszty
    category: economic
    chancePerQuarter: 0.07
    cooldownQuarters: 4
    effects:
      - correction: { units: -0.4, quarters: 1, reason: 'Przekroczenie kosztów u dostawcy' }
    text: >-
      Jeden z dostawców zgłasza, że nie zmieści się w cenie kontraktu. Tłumaczy to nowymi
      wymaganiami, których „nie było w pierwszej specyfikacji”.
    source: Dossier III, wzorzec 64

  - id: brak-materialu
    title: Brak strategicznego materiału
    category: economic
    conditions:
      any:
        - { var: koniunktura, op: '>=', value: 8 }
        - { var: napiecie_azja, op: '>=', value: 8 }
    chancePerQuarter: 0.1
    cooldownQuarters: 6
    effects:
      - correction: { units: -0.3, quarters: 2, reason: 'Niedobór niklu i tytanu: pierwszeństwo mają zamówienia wojenne' }
    text: >-
      Rząd wprowadza przydziały na nikiel i tytan. Pierwszeństwo mają zamówienia dla frontu,
      a programy doświadczalne dostają to, co zostanie.
    source: Dossier III, wzorzec 69

  - id: nowy-stop
    title: Nowy stop z laboratorium
    category: technical
    chancePerQuarter: 0.04
    cooldownQuarters: 10
    effects:
      - { faction: RN, disposition: 1 }
    text: >-
      Laboratorium metalurgiczne jednego z dostawców ogłasza stop, który wytrzymuje temperatury
      o dwieście stopni wyższe niż dotychczasowe. Konstruktorzy silników ustawiają się
      w kolejce po próbki.
    source: Dossier III, wzorzec 70

  - id: geniusz-z-prowincji
    title: Inżynier z prowincjonalnej uczelni
    category: social
    chancePerQuarter: 0.04
    cooldownQuarters: 10
    effects:
      - { var: pula_kadr, add: 1 }
    text: >-
      Na biurko Rady Naukowej trafia praca dyplomowa studenta z małej uczelni na Środkowym
      Zachodzie. Rozwiązuje w niej zagadnienie, nad którym od roku siedzi cały zespół.
      Trzeba go zatrudnić, zanim zrobi to przemysł.
    source: Dossier III, wzorzec 84

  - id: ankieta-lojalnosci
    title: Ankieta lojalności
    category: political
    region: usa
    conditions: { var: antykomunizm, op: '>=', value: 7 }
    chancePerQuarter: 0.08
    cooldownQuarters: 8
    effects:
      - { faction: RN, disposition: -1 }
      - { indicator: SO, add: -1 }
    text: >-
      Każdy pracownik agencji rządowych ma wypełnić nową ankietę lojalności: organizacje,
      do których należał, i znajomi, którzy do nich należeli. Kilku uczonych odmawia
      z zasady.
    source: Dossier III, wzorzec 88

  - id: reportaz-tygodnika
    title: Reportaż ilustrowanego tygodnika
    category: social
    chancePerQuarter: 0.05
    cooldownQuarters: 6
    effects:
      - { indicator: PP, add: 3 }
    text: >-
      Wielki tygodnik ilustrowany poświęca dwanaście stron ludziom PACE: pilotom
      doświadczalnym, rachmistrzyniom i mechanikom z hangaru. Na okładce jest samolot
      na tle wschodzącego słońca.
    source: Dossier III, wzorzec 124

  - id: felietonista
    title: Felietonista przeciw rakietom
    category: social
    chancePerQuarter: 0.05
    chanceModifiers:
      - { when: { var: koniunktura, op: '<=', value: 4 }, mul: 2 }
    cooldownQuarters: 6
    effects:
      - { indicator: PP, add: -2 }
    text: >-
      Znany felietonista pisze, że za cenę jednej próbnej rakiety można zbudować dwie szkoły.
      Tekst przedrukowuje czterdzieści gazet.
    source: Dossier III, wzorzec 125

  - id: parada-w-moskwie
    title: Parada w Moskwie
    category: military
    region: zsrr
    chancePerQuarter: 0.06
    chanceModifiers:
      - { when: { var: kurs_kremla, op: '>=', value: 7 }, mul: 1.5 }
    cooldownQuarters: 4
    effects:
      - { var: presja_wyscigu, add: 1 }
    text: >-
      Na placu Czerwonym przejeżdżają ciągniki z rakietami, jakich zachodni attaché jeszcze nie
      widzieli. Nikt nie wie, czy to broń, czy makiety. Zdjęcia trafiają do BAS tego
      samego dnia.
    source: Dossier III, wzorzec 161

  - id: oferta-pokojowa
    title: Oferta pokojowa Moskwy
    category: political
    region: zsrr
    conditions: { var: kurs_kremla, op: '<=', value: 6 }
    chancePerQuarter: 0.08
    cooldownQuarters: 8
    effects:
      - { indicator: NG, add: 1 }
      - { var: presja_wyscigu, add: -1 }
    text: >-
      Moskwa proponuje nową rundę rozmów rozbrojeniowych i jednostronnie zmniejsza armię
      o kilkaset tysięcy ludzi. W Waszyngtonie spierają się, czy to gest, czy oszczędność.
    source: Dossier III, wzorzec 163

  - id: huragan-floryda
    title: Huragan nad Florydą
    category: technical
    region: usa
    chancePerQuarter: 0.03
    cooldownQuarters: 8
    effects:
      - correction: { units: -0.4, quarters: 1, reason: 'Szkody po huraganie w ośrodku na Florydzie' }
    text: >-
      Huragan przechodzi przez środkową Florydę. W ośrodku na przylądku woda stoi w hangarach,
      a dwa maszty telemetryczne leżą na ziemi.
    source: Dossier III, wzorzec 181

  - id: szczepionka-polio
    title: Szczepionka przeciw polio
    category: social
    conditions:
      all:
        - { after: 1955-Q2 }
        - { before: 1956-Q1 }
    chancePerQuarter: 0.6
    maxTotal: 1
    effects:
      - { indicator: PP, add: 2 }
      - { faction: RN, disposition: 1 }
    text: >-
      Ogłoszono wyniki wielkiej próby: szczepionka doktora Salka chroni dzieci przed polio.
      Dzwony biją w kościołach, a słowo „naukowiec” brzmi w Ameryce lepiej niż kiedykolwiek.
    source: Dossier III, wzorzec 194 (historycznie 12 kwietnia 1955)

  - id: dobry-kwartal
    title: Spokojny kwartał
    category: social
    conditions: { indicator: SO, op: '>=', value: 65 }
    chancePerQuarter: 0.15
    cooldownQuarters: 4
    effects:
      - { indicator: SO, add: 1 }
      - { currency: KP, add: 1 }
    text: >-
      Rzadkość: kwartał bez awantur. Zespoły dotrzymują terminów, dyrektorzy ze sobą
      rozmawiają, a sekretariat Andersona nadrabia zaległą pocztę.
    source: Dossier III, wzorzec 200
