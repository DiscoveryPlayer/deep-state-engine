# Zdjęcia do kart wydarzeń (decyzja 0019).
#
# Samych plików nie ma w repozytorium. Pobiera je skrypt `npm run zdjecia` (albo plik
# Pobierz-zdjecia.bat) z Wikimedia Commons do folderu data/images/pliki/. Skrypt bierze pierwszy
# tytuł z listy `commons`, który istnieje i ma w metadanych licencję domeny publicznej (albo CC0);
# inne licencje odrzuca. Autora i licencję zapisuje do data/images/pliki/zrodla.json.
#
# Zasada doboru: maszyny, miejsca, budynki i wydarzenia. Bez portretów osób publicznych.
# `for` to tematy, przy których zdjęcie się pojawia: identyfikatory wątków, dylematów
# i wzorców albo „lot” (karty lotów PACE).

images:
  - id: start-rakiety
    file: start-rakiety.jpg
    commons:
      - 'File:Bumper8 launch-GPN-2000-000613.jpg'
      - 'File:V-2 White Sands.jpg'
    caption: Start rakiety doświadczalnej z przylądka Canaveral, 1950
    for: [lot]

